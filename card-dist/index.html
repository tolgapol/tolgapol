<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="description" content="Tolga Polat contact profile.">
  <meta property="og:title" content="Tolga Polat">
  <meta property="og:description" content="Head of Digital Marketing">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://hi.tolgapol.com/">
  <meta name="theme-color" content="#f3f0e7">
  <title>Tolga Polat | Contact Profile</title>
  <script>
    (function () {
      var hour = new Date().getHours();
      var theme = hour >= 7 && hour < 19 ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f3f0e7" : "#080807");
    })();
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      color-scheme: light dark;
      --bg: #f3f0e7;
      --ink: #11110f;
      --muted: #5c5d56;
      --soft: #85877d;
      --line: rgba(17, 17, 15, 0.14);
      --line-strong: rgba(17, 17, 15, 0.3);
      --surface: rgba(255, 255, 255, 0.46);
      --surface-strong: rgba(255, 255, 255, 0.8);
      --accent: #caff42;
      --accent-ink: #121a07;
      --blue: #3d66ff;
      --coral: #ff6a4a;
      --qr-bg: #fffdf6;
      --qr-fg: #0b0c0a;
      --shadow: 0 28px 80px rgba(32, 29, 24, 0.18);
      --display: "Iowan Old Style", "New York", "Palatino Linotype", Palatino, ui-serif, Georgia, serif;
      --body: "Aptos", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "SFMono-Regular", "Cascadia Code", "Liberation Mono", Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg: #080807;
        --ink: #f8f2e7;
        --muted: #bbb4a5;
        --soft: #807c72;
        --line: rgba(248, 242, 231, 0.13);
        --line-strong: rgba(248, 242, 231, 0.3);
        --surface: rgba(255, 255, 255, 0.055);
        --surface-strong: rgba(255, 255, 255, 0.12);
        --accent: #caff42;
        --accent-ink: #101706;
        --blue: #5d80ff;
        --coral: #ff7b5e;
        --qr-bg: #fffdf6;
        --qr-fg: #0b0c0a;
        --shadow: 0 30px 92px rgba(0, 0, 0, 0.5);
      }
    }

    html[data-theme="dark"] {
      --bg: #080807;
      --ink: #f8f2e7;
      --muted: #bbb4a5;
      --soft: #807c72;
      --line: rgba(248, 242, 231, 0.13);
      --line-strong: rgba(248, 242, 231, 0.3);
      --surface: rgba(255, 255, 255, 0.055);
      --surface-strong: rgba(255, 255, 255, 0.12);
      --accent: #caff42;
      --accent-ink: #101706;
      --blue: #5d80ff;
      --coral: #ff7b5e;
      --qr-bg: #fffdf6;
      --qr-fg: #0b0c0a;
      --shadow: 0 30px 92px rgba(0, 0, 0, 0.5);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100dvh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a,
    button {
      -webkit-tap-highlight-color: transparent;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100dvh;
      min-height: 560px;
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(360px, 0.62fr);
      overflow: hidden;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--ink) 5%, transparent) 1px, transparent 1px),
        linear-gradient(0deg, color-mix(in srgb, var(--ink) 5%, transparent) 1px, transparent 1px),
        linear-gradient(126deg, transparent 0 56%, color-mix(in srgb, var(--coral) 18%, transparent) 56% 59%, transparent 59%),
        linear-gradient(18deg, color-mix(in srgb, var(--blue) 12%, transparent), transparent 38%),
        var(--bg);
      background-size: 42px 42px, 42px 42px, 100% 100%, 100% 100%, auto;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
    }

    .stage::before {
      inset: 0 auto 0 0;
      width: 12px;
      background: linear-gradient(180deg, var(--accent), var(--blue), var(--coral));
    }

    .stage::after {
      right: 33%;
      bottom: -18%;
      width: 360px;
      height: 64%;
      border-left: 1px solid var(--line);
      transform: rotate(21deg);
      background: repeating-linear-gradient(
        90deg,
        transparent 0 12px,
        color-mix(in srgb, var(--ink) 6%, transparent) 12px 13px
      );
      opacity: 0.65;
    }

    .profile-panel {
      min-width: 0;
      height: 100dvh;
      min-height: 560px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 26px;
      padding: 42px 54px 42px 66px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      color: var(--soft);
      font-family: var(--mono);
      font-size: 0.73rem;
      text-transform: uppercase;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .status::before {
      content: "";
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .card-url {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .identity {
      min-width: 0;
      align-self: center;
      display: grid;
      gap: 28px;
    }

    .portrait {
      position: relative;
      width: 116px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 74%, transparent) 0 34%, transparent 34%),
        linear-gradient(45deg, transparent 0 55%, color-mix(in srgb, var(--blue) 70%, transparent) 55% 60%, transparent 60%),
        color-mix(in srgb, var(--surface-strong) 84%, transparent);
      box-shadow: var(--shadow);
      color: var(--ink);
      font-family: var(--display);
      font-size: 2.7rem;
      line-height: 1;
    }

    .portrait img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .name-block {
      min-width: 0;
      display: grid;
      gap: 18px;
    }

    h1 {
      max-width: 8ch;
      margin: 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: 7.4rem;
      font-weight: 520;
      letter-spacing: 0;
      line-height: 0.86;
      text-wrap: balance;
    }

    .role-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: var(--muted);
      font-size: 1.22rem;
      font-weight: 780;
      line-height: 1.24;
    }

    .role-line span + span {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .role-line span + span::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .summary {
      max-width: 650px;
      margin: 0;
      color: var(--muted);
      font-family: var(--display);
      font-size: 1.7rem;
      line-height: 1.22;
      overflow-wrap: break-word;
    }

    .metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      color: var(--soft);
      font-family: var(--mono);
      font-size: 0.74rem;
      text-transform: uppercase;
    }

    .metadata span {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .metadata span + span::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--line-strong);
    }

    .bottom-row {
      min-width: 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 22px;
    }

    .quick-links {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .quick-link,
    .save-button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 0.94rem;
      font-weight: 780;
      padding: 0 18px;
      white-space: nowrap;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .quick-link:hover,
    .save-button:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent) 78%, var(--ink) 22%);
      background: var(--surface-strong);
    }

    .save-button {
      flex: 0 0 auto;
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }

    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.9;
    }

    .qr-panel {
      min-width: 0;
      height: 100dvh;
      min-height: 560px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 26px;
      border-left: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.08), transparent 30%),
        color-mix(in srgb, var(--ink) 8%, var(--bg) 92%);
      padding: 42px;
    }

    .qr-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--soft);
      font-family: var(--mono);
      font-size: 0.73rem;
      text-transform: uppercase;
    }

    .qr-heading strong {
      color: var(--ink);
      font-weight: 780;
    }

    .qr-stage {
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .qr-code {
      width: min(360px, 74%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 30px;
      background: var(--qr-bg);
      color: var(--qr-fg);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .qr-code svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: crispEdges;
    }

    .qr-data {
      display: grid;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }

    .qr-data-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--soft);
      font-family: var(--mono);
      font-size: 0.73rem;
      text-transform: uppercase;
    }

    .qr-data-row strong {
      color: var(--ink);
      font-weight: 780;
      text-align: right;
      text-transform: none;
    }

    .mobile-save {
      position: fixed;
      right: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 14px;
      z-index: 30;
      min-height: 58px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid color-mix(in srgb, var(--accent) 76%, var(--bg) 24%);
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.34);
      color: var(--accent-ink);
      font-size: 1rem;
      font-weight: 850;
      padding: 0 22px;
    }

    .is-hidden {
      display: none !important;
    }

    .enter {
      animation: enter 560ms ease both;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1080px) {
      .stage {
        grid-template-columns: 1fr;
      }

      .profile-panel {
        padding: 30px 24px 88px 30px;
      }

      .qr-panel,
      .desktop-save,
      .card-url {
        display: none;
      }

      .mobile-save {
        display: flex;
      }

      .identity {
        gap: 20px;
      }

      .portrait {
        width: 94px;
      }

      h1 {
        max-width: 6ch;
        font-size: 4.45rem;
        line-height: 0.9;
      }

      .role-line {
        display: grid;
        gap: 5px;
        font-size: 1.02rem;
      }

      .role-line span + span::before {
        display: none;
      }

      .summary {
        max-width: 20.5rem;
        font-size: 1.18rem;
        line-height: 1.28;
      }

      .metadata {
        display: grid;
        gap: 7px;
        font-size: 0.67rem;
      }

      .metadata span + span::before {
        display: none;
      }

      .bottom-row {
        align-items: stretch;
      }

      .quick-links {
        width: 100%;
        display: flex;
      }

      .quick-link {
        min-width: 0;
        width: 52px;
        min-height: 46px;
        padding: 0;
      }

      .quick-link span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    }

    @media (max-width: 420px) {
      .profile-panel {
        padding: 24px 18px 84px 24px;
        gap: 18px;
      }

      .topline {
        font-size: 0.67rem;
      }

      .portrait {
        width: 82px;
      }

      h1 {
        font-size: 4rem;
      }

      .summary {
        max-width: 18rem;
        font-size: 1.08rem;
      }

      .quick-link {
        font-size: 0.82rem;
      }
    }

    @media (max-height: 720px) and (max-width: 1080px) {
      .profile-panel {
        padding-top: 18px;
        gap: 14px;
      }

      .identity {
        gap: 14px;
      }

      .portrait {
        width: 70px;
      }

      h1 {
        font-size: 3.25rem;
      }

      .name-block {
        gap: 10px;
      }

      .summary {
        max-width: 17rem;
        font-size: 0.98rem;
      }

      .metadata {
        gap: 5px;
      }

      .quick-link {
        min-height: 40px;
      }

      .mobile-save {
        min-height: 52px;
      }
    }

    @media (min-width: 1440px) {
      .profile-panel {
        padding-left: 86px;
      }

      h1 {
        font-size: 8.4rem;
      }

      .summary {
        font-size: 1.9rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage enter">
    <section class="profile-panel" aria-label="Profile">
      <header class="topline">
        <span class="status">Personal contact</span>
        <a class="card-url" id="card-url" href="https://hi.tolgapol.com/">hi.tolgapol.com</a>
      </header>

      <div class="identity">
        <div class="portrait" id="portrait" aria-hidden="true"></div>
        <div class="name-block">
          <h1 id="profile-name">Tolga Polat</h1>
          <p class="role-line">
            <span id="profile-title">Head of Digital Marketing</span>
            <span id="profile-organization">incehesap.com</span>
          </p>
          <p class="summary" id="profile-summary">Marketing leader building growth systems across digital strategy, analytics, automation, and high-intent customer journeys.</p>
          <div class="metadata" id="metadata"></div>
        </div>
      </div>

      <div class="bottom-row">
        <nav class="quick-links" id="quick-links" aria-label="Public contact links"></nav>
        <a class="save-button desktop-save" id="desktop-save" href="tolga-polat.vcf" download="tolga-polat.vcf">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          <span>Add to Contacts</span>
        </a>
      </div>
    </section>

    <aside class="qr-panel" aria-label="vCard QR code">
      <div class="qr-heading">
        <span>vCard QR</span>
        <strong id="vcard-version">3.0</strong>
      </div>
      <div class="qr-stage">
        <div class="qr-code" id="qr-code"></div>
      </div>
      <div class="qr-data">
        <div class="qr-data-row">
          <span>Payload</span>
          <strong id="qr-payload-size">-</strong>
        </div>
        <div class="qr-data-row">
          <span>Source</span>
          <strong id="qr-source">Direct vCard</strong>
        </div>
      </div>
    </aside>
  </main>

  <a class="mobile-save" id="mobile-save" href="tolga-polat.vcf" download="tolga-polat.vcf">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    <span>Add to Contacts</span>
  </a>

  <script src="profile-card-data.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script>
    var data = window.PROFILE_CARD_DATA;
    var blobUrl = null;

    var iconMap = {
      email: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"></path><path d="m4 7 8 6 8-6"></path></svg>',
      website: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18"></path><path d="M12 3a14 14 0 0 0 0 18"></path></svg>',
      linkedin: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11v7"></path><path d="M8 8v.01"></path><path d="M12 18v-7"></path><path d="M12 14.5c0-2 1.2-3.5 3-3.5s3 1.2 3 3.5V18"></path><path d="M5 4h14v16H5z"></path></svg>',
      github: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 22v-3.5a3.2 3.2 0 0 0-.9-2.5c3-.3 6.1-1.5 6.1-6.5a5 5 0 0 0-1.3-3.5 4.6 4.6 0 0 0-.1-3.4s-1.1-.3-3.6 1.3a12.4 12.4 0 0 0-6.4 0C6.3 1.8 5.2 2.1 5.2 2.1a4.6 4.6 0 0 0-.1 3.4 5 5 0 0 0-1.3 3.5c0 5 3.1 6.1 6.1 6.5a2.9 2.9 0 0 0-.9 2.1V22"></path></svg>',
      twitter: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 11.5 16H20L8.5 4z"></path><path d="M4 20 20 4"></path></svg>',
      instagram: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"></rect><circle cx="12" cy="12" r="3.2"></circle><path d="M17 7.2v.01"></path></svg>',
      link: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"></path><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"></path></svg>'
    };

    function init() {
      renderProfile(data);
      renderLinks(data);
      // QR: no photo (keeps payload compact and avoids expired/blocked CDN URLs)
      renderQr(buildVCard(data, true), data.site.qrErrorCorrection || "M");
      // Download: try to embed photo as base64 for reliable offline import
      buildVCardForDownload(data, installVCardDownload);
    }

    function buildVCardForDownload(config, callback) {
      var photoUrl = config.display.showPhoto && config.contact.photo.includeInVCard
        ? config.display.photoUrl : null;
      if (!photoUrl) { callback(buildVCard(config)); return; }
      fetch(photoUrl)
        .then(function(r) { return r.ok ? r.blob() : Promise.reject(); })
        .then(function(blob) {
          var reader = new FileReader();
          reader.onloadend = function() {
            var copy = JSON.parse(JSON.stringify(config));
            copy.contact.photo.data = reader.result.replace(/^data:[^,]+,/, "");
            callback(buildVCard(copy));
          };
          reader.readAsDataURL(blob);
        })
        .catch(function() { callback(buildVCard(config)); });
    }

    function renderProfile(config) {
      var fullName = getFullName(config.contact);
      document.title = fullName + " | Contact Profile";
      document.getElementById("profile-name").textContent = config.display.headline || fullName;
      document.getElementById("profile-title").textContent = config.display.title || config.contact.jobTitle || "";
      document.getElementById("profile-organization").textContent = config.display.organization || config.contact.organization || "";
      document.getElementById("profile-summary").textContent = config.display.summary || config.contact.note || "";
      document.getElementById("card-url").href = config.site.cardUrl;
      document.getElementById("card-url").textContent = stripProtocol(config.site.cardUrl);
      document.getElementById("vcard-version").textContent = config.site.vcardVersion || "4.0";

      var portrait = document.getElementById("portrait");
      portrait.textContent = "";
      if (config.display.showPhoto && config.display.photoUrl) {
        var image = document.createElement("img");
        image.src = config.display.photoUrl;
        image.alt = "";
        portrait.appendChild(image);
      } else {
        portrait.textContent = config.display.monogram || initials(fullName);
      }

      var metadata = [config.display.location, config.display.signal].filter(Boolean);
      document.getElementById("metadata").innerHTML = metadata.map(function (item) {
        return "<span>" + escapeHtml(item) + "</span>";
      }).join("");
    }

    function renderLinks(config) {
      var preferred = config.display.visibleLinks || [];
      var links = [];

      list(config.contact.websites).filter(function (item) { return item.url; }).forEach(function (site, index) {
        links.push({
          key: site.key || (index === 0 ? "website" : "link-" + index),
          label: site.label || "Website",
          href: site.url,
          icon: index === 0 ? "website" : "link",
          visible: site.visible !== false
        });
      });

      list(config.contact.emails).filter(function (item) { return item.email; }).forEach(function (email) {
        links.push({
          key: email.key || (email.type === "work" ? "work-email" : "email"),
          label: email.label || "Email",
          href: "mailto:" + email.email,
          icon: "email",
          visible: email.visible === true
        });
      });

      getSocialLinks(config.contact.social).forEach(function (social) {
        links.push(social);
      });

      var visible = links.filter(function (item) {
        if (preferred.length) return preferred.indexOf(item.key) !== -1;
        return item.visible;
      });

      document.getElementById("quick-links").innerHTML = visible.map(renderQuickLink).join("");
    }

    function renderQuickLink(item) {
      return '<a class="quick-link" href="' + escapeAttribute(item.href) + '" aria-label="' + escapeAttribute(item.label) + '" title="' + escapeAttribute(item.label) + '">' +
        (iconMap[item.icon] || iconMap.link) +
        '<span>' + escapeHtml(item.label) + '</span>' +
        "</a>";
    }

    function renderQr(vcard, errorCorrection) {
      var target = document.getElementById("qr-code");
      try {
        var qr = qrcode(0, errorCorrection);
        qr.addData(vcard);
        qr.make();
        var count = qr.getModuleCount();
        var path = "";
        for (var y = 0; y < count; y += 1) {
          for (var x = 0; x < count; x += 1) {
            if (qr.isDark(y, x)) path += "M" + x + " " + y + "h1v1H" + x + "z";
          }
        }
        target.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + count + " " + count + '" role="img" aria-label="vCard QR code">' +
          '<rect width="' + count + '" height="' + count + '" fill="#fff"></rect>' +
          '<path d="' + path + '" fill="currentColor"></path>' +
          "</svg>";
        document.getElementById("qr-payload-size").textContent = vcard.length + " chars";
      } catch (error) {
        target.textContent = "Payload too large";
        document.getElementById("qr-payload-size").textContent = "too large";
      }
    }

    function installVCardDownload(vcard) {
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(new Blob([vcard], { type: "text/vcard;charset=utf-8" }));
      var filename = slugify(getFullName(data.contact)) + ".vcf";
      ["desktop-save", "mobile-save"].forEach(function (id) {
        var link = document.getElementById(id);
        link.href = blobUrl;
        link.download = filename;
      });
    }

    function buildVCard(config, skipPhoto) {
      var c = config.contact;
      var version = config.site.vcardVersion || "4.0";
      var lines = [
        "BEGIN:VCARD",
        "VERSION:" + version,
        "N:" + [c.lastName, c.firstName, c.additionalNames, c.prefix, c.suffix].map(escapeVCardText).join(";"),
        "FN:" + escapeVCardText(getFullName(c))
      ];
      if (version === "4.0") lines.splice(2, 0, "KIND:individual");

      addPronouns(lines, c.pronouns);
      addLine(lines, "TITLE", c.jobTitle);
      addLine(lines, "ROLE", c.role);
      if (c.organization || c.department) {
        lines.push("ORG:" + [c.organization, c.department].map(escapeVCardText).join(";"));
      }
      if (!skipPhoto) addPhoto(lines, c.photo, version);

      list(c.phones).forEach(function (phone) {
        if (!phone.number) return;
        var phoneType = normalizePhoneType(phone.type).toUpperCase();
        lines.push("TEL;type=" + phoneType + ";type=VOICE" + (phone.pref ? ";type=pref" : "") + ":" + cleanPhone(phone.number));
      });

      list(c.emails).forEach(function (email) {
        if (!email.email) return;
        var emailType = normalizeEmailType(email.type).toUpperCase();
        lines.push("EMAIL;type=INTERNET;type=" + emailType + (email.pref ? ";type=pref" : "") + ":" + email.email.trim());
      });

      var itemIndex = 1;
      list(c.websites).forEach(function (site) {
        if (!site.url) return;
        var siteType = normalizeWebsiteType(site.type || site.label).toUpperCase();
        lines.push("URL;type=" + siteType + (site.pref ? ";type=pref" : "") + ":" + site.url.trim());
      });

      // ISO 8601 date with dashes — matches iOS own export format
      if (c.birthday) lines.push("BDAY:" + c.birthday);
      list(c.dates).forEach(function (date) {
        if (!date.value) return;
        if (date.label && date.label.toLowerCase() === "anniversary") {
          lines.push("ANNIVERSARY:" + dateToBasic(date.value));
        } else {
          lines.push("item" + itemIndex + ".X-ABDATE:" + dateToBasic(date.value));
          lines.push("item" + itemIndex + ".X-ABLabel:" + escapeVCardText(date.label || "Other"));
          itemIndex += 1;
        }
      });

      if (hasAddress(c.address)) {
        lines.push("item" + itemIndex + ".ADR;type=" + normalizeAddressType(c.address.type) + ";type=pref:;;" +
          [c.address.street || c.address.formatted, c.address.locality, c.address.region, c.address.postalCode, c.address.country]
            .map(escapeVCardText)
            .join(";"));
        if (c.address.countryCode) {
          lines.push("item" + itemIndex + ".X-ABADR:" + c.address.countryCode);
        }
        itemIndex += 1;
      }

      addLine(lines, "NOTE", c.note);
      addSocialProfile(lines, "linkedin", c.social.linkedin);
      addSocialProfile(lines, "instagram", c.social.instagram);
      addSocialProfile(lines, "github", c.social.github);
      addLine(lines, "REV", config.site.generatedAt);
      lines.push("END:VCARD");
      return foldVCardLines(lines).join("\r\n") + "\r\n";
    }

    function addLine(lines, name, value) {
      if (value) lines.push(name + ":" + escapeVCardText(value));
    }

    function addPronouns(lines, value) {
      var entries = Array.isArray(value) ? value : (value ? [{ value: value }] : []);
      entries.forEach(function (entry, index) {
        var pronouns = typeof entry === "string" ? entry : entry.value;
        if (!pronouns) return;
        var params = [];
        if (entry.language) params.push("LANGUAGE=" + escapeVCardParam(entry.language));
        if (entry.pref || index === 0) params.push("PREF=" + (entry.pref || 1));
        if (entry.type) params.push("TYPE=" + escapeVCardParam(entry.type));
        lines.push("PRONOUNS" + (params.length ? ";" + params.join(";") : "") + ":" + escapeVCardText(pronouns));
      });
    }

    function addPhoto(lines, photo, version) {
      if (!photo || !photo.includeInVCard) return;
      var mediaType = photo.mediaType || "image/jpeg";
      var imageType = mediaType.split("/").pop().toUpperCase();
      if (photo.data) {
        lines.push("PHOTO;ENCODING=b;TYPE=" + imageType + ":" + String(photo.data).replace(/^data:[^,]+,/, "").replace(/\s+/g, ""));
        return;
      }
      if (isAbsoluteUrl(photo.url)) {
        lines.push((version === "4.0" ? "PHOTO;MEDIATYPE=" + mediaType : "PHOTO;TYPE=" + imageType) + ":" + photo.url);
      }
    }

    function addSocialProfile(lines, service, value) {
      if (!value) return;
      var normalized = normalizeSocial(service, value);
      // Service type casing must match Apple Contacts framework constants
      var typeNames = { linkedin: "linkedin", instagram: "Instagram", github: "GitHub", twitter: "twitter" };
      var serviceType = typeNames[service] || service;
      if (service === "linkedin") {
        // LinkedIn: no x-user, matches iOS own export format
        lines.push("X-SOCIALPROFILE;type=linkedin:" + normalized.url);
      } else {
        lines.push("X-SOCIALPROFILE;type=" + serviceType + ";x-user=" + escapeVCardParam(normalized.username) + ":" + normalized.url);
      }
    }

    function addInstantMessage(lines, im, itemIndex) {
      if (!im || (!im.username && !im.uri)) return itemIndex;
      var service = String(im.service || "").toLowerCase();
      var serviceNameMap = { whatsapp: "WhatsApp", linkedin: "LinkedIn", skype: "Skype" };
      var serviceName = serviceNameMap[service] || (service ? service.charAt(0).toUpperCase() + service.slice(1) : "IM");
      // Use explicit URI if provided (e.g. wa.me link, profile URL) for tappable links in Apple Contacts
      var imppValue = im.uri ? im.uri.trim() : ("x-apple:" + im.username.trim());
      lines.push("item" + itemIndex + ".IMPP;X-SERVICE-TYPE=" + escapeVCardParam(serviceName) + (im.pref ? ";type=pref" : "") + ":" + escapeVCardText(imppValue));
      lines.push("item" + itemIndex + ".X-ABLabel:" + escapeVCardText(serviceName));
      if (service === "skype" && im.username) lines.push("X-SKYPE-USERNAME:" + escapeVCardText(im.username.trim()));
      return itemIndex + 1;
    }

    function getSocialLinks(social) {
      return ["linkedin", "github", "twitter", "instagram"].map(function (key) {
        var value = social[key];
        if (!value) return null;
        var normalized = normalizeSocial(key, value);
        return {
          key: key,
          label: key === "twitter" ? "X" : key.charAt(0).toUpperCase() + key.slice(1),
          href: normalized.url,
          icon: key,
          visible: true
        };
      }).filter(Boolean);
    }

    function normalizeSocial(service, value) {
      var raw = value.trim();
      if (service === "linkedin") {
        var linkedinUser = raw.replace(/^https?:\/\/(www\.)?linkedin\.com\/in\//i, "").replace(/\/$/, "").replace(/^@/, "");
        return { username: linkedinUser, url: raw.indexOf("http") === 0 ? raw : "https://linkedin.com/in/" + linkedinUser };
      }
      var username = raw.replace(/^@/, "").replace(/^https?:\/\/(www\.)?(x\.com|twitter\.com|instagram\.com|github\.com)\//i, "").replace(/\/$/, "");
      var hosts = {
        twitter: "https://x.com/",
        instagram: "https://instagram.com/",
        github: "https://github.com/"
      };
      return { username: username, url: (hosts[service] || "") + username };
    }

    function getFullName(contact) {
      return [contact.prefix, contact.firstName, contact.additionalNames, contact.lastName, contact.suffix].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
    }

    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map(function (part) { return part[0]; }).join("").toUpperCase();
    }

    function stripProtocol(url) {
      return String(url || "").replace(/^https?:\/\//, "").replace(/\/$/, "");
    }

    function cleanPhone(value) {
      return String(value || "").replace(/[^\d+]/g, "");
    }

    function formatAddress(address) {
      if (!address) return "";
      return address.formatted || [address.street, address.locality, address.region, address.postalCode, address.country].filter(Boolean).join(", ");
    }

    function hasAddress(address) {
      return Boolean(formatAddress(address));
    }

    function dateToBasic(value) {
      return String(value || "").replace(/-/g, "");
    }

    function normalizePhoneType(type) {
      var map = { mobile: "cell", cell: "cell", work: "work", home: "home", fax: "fax", voice: "voice" };
      return map[String(type || "").toLowerCase()] || "cell";
    }

    function normalizeEmailType(type) {
      var map = { personal: "home", internet: "internet", work: "work", home: "home" };
      return map[String(type || "").toLowerCase()] || "internet";
    }

    function normalizeAddressType(type) {
      var map = { work: "work", home: "home", billing: "billing", delivery: "delivery" };
      return map[String(type || "").toLowerCase()] || "work";
    }

    function normalizeWebsiteType(type) {
      var map = { work: "work", office: "work", company: "work", home: "home", personal: "home", website: "home" };
      return map[String(type || "").toLowerCase()] || "home";
    }

    function escapeVCardText(value) {
      return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,")
        .replace(/\r?\n/g, "\\n");
    }

    function escapeVCardParam(value) {
      return String(value || "").replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/[;,:]/g, "-");
    }

    function foldVCardLines(lines) {
      var encoder = new TextEncoder();
      return lines.flatMap(function (line) {
        var chunks = [];
        var current = "";
        Array.from(line).forEach(function (char) {
          if (encoder.encode(current + char).length > 75) {
            chunks.push(current);
            current = " " + char;
          } else {
            current += char;
          }
        });
        chunks.push(current);
        return chunks;
      });
    }

    function isAbsoluteUrl(value) {
      return /^https?:\/\//i.test(String(value || ""));
    }

    function list(value) {
      return Array.isArray(value) ? value : [];
    }

    function slugify(value) {
      return String(value || "contact").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, function (char) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char];
      });
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    init();
  </script>
</body>
</html>
