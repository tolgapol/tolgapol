<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="description" content="Tolga Polat — Head of Digital Marketing, incehesap.com">
  <meta property="og:title" content="Tolga Polat">
  <meta property="og:description" content="Head of Digital Marketing · incehesap.com">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://hi.tolgapol.com/">
  <meta property="og:image" content="https://hi.tolgapol.com/assets/tolga-polat.jpg">
  <meta name="theme-color" content="#f3f0e7">
  <title>Tolga Polat</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function(){
      var s=localStorage.getItem('tp-theme');
      var theme=s==='light'||s==='dark'?s:(new Date().getHours()>=7&&new Date().getHours()<19?'light':'dark');
      document.documentElement.dataset.theme=theme;
      document.querySelector('meta[name="theme-color"]').content=theme==='light'?'#f3f0e7':'#080807';
    })();
  </script>
</head>
<body>
  <main class="stage enter">
    <section class="profile-panel" aria-label="Profile">
      <header class="topline">
        <span class="status">incehesap.com</span>
        <div id="controls" class="controls" aria-label="Display controls"></div>
      </header>

      <div class="identity">
        <div class="portrait" aria-hidden="true">
          <img src="assets/tolga-polat.jpg" alt="" width="116" height="116" fetchpriority="high">
        </div>
        <div class="name-block">
          <h1>Tolga<br>Polat</h1>
          <p class="role-line">
            <span id="profile-title">Head of Digital Marketing</span>
            <span>incehesap.com</span>
          </p>
          <p class="summary" id="profile-summary">Marketing leader building performance-driven growth for Türkiye's largest tech e-commerce marketplace.</p>
          <div class="metadata">
            <span>Istanbul, Türkiye</span>
            <span>Growth · Analytics · Automation</span>
          </div>
        </div>
      </div>

      <div class="bottom-row">
        <nav class="quick-links" id="quick-links" aria-label="Contact links"></nav>
        <a class="save-button desktop-save" id="desktop-save" href="tolga-polat.vcf" download="tolga-polat.vcf">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          <span id="save-label">Save Contact</span>
        </a>
      </div>
    </section>

    <aside class="qr-panel" aria-label="QR code to save contact">
      <div class="qr-stage">
        <div class="qr-code" id="qr-code"></div>
      </div>
      <p class="qr-caption" id="qr-scan-label">Scan to Save</p>
    </aside>
  </main>

  <a class="mobile-save" id="mobile-save" href="tolga-polat.vcf" download="tolga-polat.vcf" aria-label="Save Contact">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    <span id="mobile-save-label">Save Contact</span>
  </a>

  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
