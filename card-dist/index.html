<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="description" content="Tolga Polat — Head of Digital Marketing, incehesap.com">
  <meta property="og:title" content="Tolga Polat">
  <meta property="og:description" content="Head of Digital Marketing · incehesap.com">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://hi.tolgapol.com/">
  <meta property="og:image" content="https://hi.tolgapol.com/assets/tolga-polat.jpg">
  <meta name="theme-color" content="#09090b">
  <title>Tolga Polat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function(){
      var s=localStorage.getItem('tp-theme');
      var t=s==='light'||s==='dark'?s:'dark';
      document.documentElement.dataset.theme=t;
      document.querySelector('meta[name="theme-color"]').content=t==='light'?'#fafafa':'#09090b';
    })();
  </script>
</head>
<body>
  <div class="bg-noise" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="lang-wrap">
      <select id="lang-select" aria-label="Select language">
        <option value="en">EN — English</option>
        <option value="tr">TR — Türkçe</option>
        <option value="es">ES — Español</option>
        <option value="de">DE — Deutsch</option>
        <option value="fr">FR — Français</option>
        <option value="zh-TW">繁 — 繁體中文</option>
        <option value="zh-CN">简 — 简体中文</option>
      </select>
    </div>
    <button class="icon-btn" id="theme-toggle" aria-label="Switch to light mode">
      <svg class="icon" id="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </header>

  <main class="card" aria-label="Contact profile">
    <div class="avatar fade-up">
      <img src="assets/tolga-polat.jpg" alt="" width="88" height="88" fetchpriority="high">
    </div>
    <h1 class="fade-up">Tolga Polat</h1>
    <p class="role fade-up" id="profile-title">Head of Digital Marketing</p>
    <div class="company-logo fade-up" aria-label="incehesap.com">
      <img src="assets/incehesap-logo.svg" alt="incehesap.com" width="148" height="26">
    </div>
    <p class="location fade-up">Istanbul, Türkiye</p>
    <p class="bio fade-up" id="profile-summary"></p>
    <nav class="social-links fade-up" id="quick-links" aria-label="Contact links"></nav>
  </main>

  <div class="divider" aria-hidden="true"></div>

  <footer class="bottom">
    <div class="qr-block" id="qr-block">
      <div class="qr-inner" id="qr-code"></div>
      <p class="qr-label" id="qr-scan-label">Scan to Save</p>
    </div>
    <a class="btn-save" id="desktop-save" href="tolga-polat.vcf" download="tolga-polat.vcf">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      <span id="save-label">Save Contact</span>
    </a>
  </footer>

  <a class="mobile-save" id="mobile-save" href="tolga-polat.vcf" download="tolga-polat.vcf">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    <span id="mobile-save-label">Save Contact</span>
  </a>

  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
